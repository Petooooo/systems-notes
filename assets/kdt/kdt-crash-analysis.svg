<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="t d"><title id="t">Crash dump · snapshot versus history</title><desc id="d">A vmcore needs matching symbols and independent evidence</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#76c9d3" stroke-width="1.8"/></marker></defs><rect width="1280" height="650" rx="18" fill="#0b1421"/><rect x="42" y="141" width="1196" height="432" rx="17" fill="#101f2e" stroke="#2c4356"/><text x="43" y="57" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="30" font-weight="700" fill="#f1f8fe">Crash dump · snapshot versus history</text><text x="43" y="97" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#acc6d7">A vmcore needs matching symbols and independent evidence</text><path d="M42 119L1238 119" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="184" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" fill="#e1edf8">A memory snapshot is not a recording of the whole failure</text><path d="M108 312L1145 312" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="95" y="249" width="337" height="139" rx="11" fill="#393849" stroke="#837b91" stroke-width="1.7"/><text x="263.5" y="285" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Pre-crash history</text><text x="263.5" y="310" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">logs or traces may be missing</text><path d="M492 202L492 475" fill="none" stroke="#efb879" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" /><text x="492" y="193" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="700" fill="#f3c78e">crash</text><rect x="546" y="249" width="283" height="139" rx="11" fill="#20524e" stroke="#79cdb2" stroke-width="1.7"/><text x="687.5" y="285" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">vmcore</text><text x="687.5" y="310" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">memory + task state</text><rect x="901" y="249" width="272" height="139" rx="11" fill="#20524e" stroke="#79cdb2" stroke-width="1.7"/><text x="1037.0" y="285" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Analysis</text><text x="1037.0" y="310" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">symbols + hypothesis</text><path d="M833 314L897 314" fill="none" stroke="#76c9d3" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="78" y="457" width="329" height="63" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="242.5" y="493" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">kernel logs</text><rect x="474" y="457" width="329" height="63" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="638.5" y="493" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">vmlinux + symbols</text><rect x="870" y="457" width="329" height="63" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="1034.5" y="493" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">safe reproduction</text><path d="M42 599L1238 599" fill="none" s