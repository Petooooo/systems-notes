<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="t d"><title id="t">POSIX · process and thread boundaries</title><desc id="d">Shared address space versus explicit inter-process communication</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#76c9d3" stroke-width="1.8"/></marker></defs><rect width="1280" height="650" rx="18" fill="#0b1421"/><rect x="42" y="141" width="1196" height="432" rx="17" fill="#101f2e" stroke="#2c4356"/><text x="43" y="57" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="30" font-weight="700" fill="#f1f8fe">POSIX · process and thread boundaries</text><text x="43" y="97" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#acc6d7">Shared address space versus explicit inter-process communication</text><path d="M42 119L1238 119" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="66" y="189" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" fill="#d5edf7">Separate processes communicate; threads share memory</text><rect x="64" y="240" width="374" height="266" rx="11" fill="#233b51" stroke="#628ea7" stroke-width="1.7"/><text x="251.0" y="276" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Process A</text><rect x="846" y="240" width="374" height="266" rx="11" fill="#233b51" stroke="#628ea7" stroke-width="1.7"/><text x="1033.0" y="276" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Process B</text><rect x="97" y="320" width="142" height="67" rx="11" fill="#205947" stroke="#75c9a8" stroke-width="1.7"/><text x="168.0" y="356" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Thread 1</text><rect x="267" y="320" width="141" height="67" rx="11" fill="#205947" stroke="#75c9a8" stroke-width="1.7"/><text x="337.5" y="356" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Thread 2</text><rect x="927" y="319" width="225" height="74" rx="11" fill="#205947" stroke="#75c9a8" stroke-width="1.7"/><text x="1039.5" y="355" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Private memory</text><rect x="494" y="332" width="296" height="75" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="642.0" y="368" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Pipe / socket / IPC</text><path d="M441 371L490 371" fill="none" stroke="#76c9d3" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M795 371L841 371" fill="none" stroke="#76c9d3" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M42 599L1238 599" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="628" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#b2c8d5">This does not imply pipes and sockets provide identical guarantees.</text></svg>