<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="t d"><title id="t">Linux latency · competing hypotheses</title><desc id="d">Scheduling, reclaim and device I/O can all lengthen an application request</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#76c9d3" stroke-width="1.8"/></marker></defs><rect width="1280" height="650" rx="18" fill="#0b1421"/><rect x="42" y="141" width="1196" height="432" rx="17" fill="#101f2e" stroke="#2c4356"/><text x="43" y="57" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="30" font-weight="700" fill="#f1f8fe">Linux latency · competing hypotheses</text><text x="43" y="97" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#acc6d7">Scheduling, reclaim and device I/O can all lengthen an application request</text><path d="M42 119L1238 119" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="68" y="318" width="234" height="86" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="185.0" y="354" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Slow request</text><text x="185.0" y="379" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">symptom</text><rect x="431" y="191" width="310" height="83" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="586.0" y="227" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Runnable wait</text><text x="586.0" y="252" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">scheduler trace</text><path d="M304 360H369V232H427" fill="none" stroke="#