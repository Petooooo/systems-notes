<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="t d"><title id="t">Complexity · relative growth</title><desc id="d">Big-O expresses asymptotic growth, not absolute runtime</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#76c9d3" stroke-width="1.8"/></marker></defs><rect width="1280" height="650" rx="18" fill="#0b1421"/><rect x="42" y="141" width="1196" height="432" rx="17" fill="#101f2e" stroke="#2c4356"/><text x="43" y="57" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="30" font-weight="700" fill="#f1f8fe">Complexity · relative growth</text><text x="43" y="97" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#acc6d7">Big-O expresses asymptotic growth, not absolute runtime</text><path d="M42 119L1238 119" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="71" y="185" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" fill="#d7edf7">Asymptotic cost trends (not timing measurements)</text><path d="M165 521L1177 521" fill="none" stroke="#819bad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M165 210L165 521" fill="none" stroke="#819bad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M170 485Q740 468 1143 446" fill="none" stroke="#79d7b9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M170 498L1143 336" fill="none" stroke="#72c6e4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M170 507Q825 488 1143 238" fill="none" stroke="#efc081" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="978" y="442" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" fill="#9af1