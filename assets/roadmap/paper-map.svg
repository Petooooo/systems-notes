idth="333" height="60" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="634.5" y="499" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Trade-offs?</text><rect x="868" y="463" width="333" height="60" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="1034.5" y="499" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Tail / correctness?</text><path d="M42 599L1238 599" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="628" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#b2c8d5">This reusable checklist is separate from paper-specific architecture diagrams.</text></svg>