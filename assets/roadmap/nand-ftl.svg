<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="t d"><title id="t">FTL · out-of-place update</title><desc id="d">Logical-to-physical remapping leaves stale pages for later garbage collection</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#76c9d3" stroke-width="1.8"/></marker></defs><rect width="1280" height="650" rx="18" fill="#0b1421"/><rect x="42" y="141" width="1196" height="432" rx="17" fill="#101f2e" stroke="#2c4356"/><text x="43" y="57" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="30" font-weight="700" fill="#f1f8fe">FTL · out-of-place update</text><text x="43" y="97" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#acc6d7">Logical-to-physical remapping leaves stale pages for later garbage collection</text><path d="M42 119L1238 119" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="188" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" fill="#d5eaf4">Logical overwrites do not require physical in-place overwrites</text><rect x="68" y="282" width="276" height="81" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="206.0" y="318" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">LBA 3</text><text x="206.0" y="343" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">logical address</text><rect x="478" y="252" width="264" height="142" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="610.0" y="288" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">FTL mapping</text><text x="610.0" y="313" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">LBA → physical page</text><path d="M349 319L473 319" fill="none" stroke="#76c9d3" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="873" y="238" width="291" height="79" rx="11" fill="#493d43" stroke="#9a8185" stroke-width="1.7"/><text x="1018.5" y="274" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Old PPA</text><text x="1018.5" y="299" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">stale / invalid</text><rect x="873" y="378" width="291" height="79" rx="11" fill="#1e594b" stroke="#7bcfae" stroke-width="1.7"/><text x="1018.5" y="414" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">New PPA</text><text x="1018.5" y="439" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">valid data</text><path d="M747 325H806V417H869" fill="none" stroke="#77c9c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="648" y="516" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" fill="#c8dfe9">NAND erases blocks, not arbitrary individual pages.</text><path d="M42 599L1238 599" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="628" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#b2c8d5">Filesystem GC and the SSD controller GC are distinct layers.</text></svg>