<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="t d"><title id="t">Dynamic programming · recurrence table</title><desc id="d">Small state table makes base cases and transitions visible</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#76c9d3" stroke-width="1.8"/></marker></defs><rect width="1280" height="650" rx="18" fill="#0b1421"/><rect x="42" y="141" width="1196" height="432" rx="17" fill="#101f2e" stroke="#2c4356"/><text x="43" y="57" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="30" font-weight="700" fill="#f1f8fe">Dynamic programming · recurrence table</text><text x="43" y="97" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#acc6d7">Small state table makes base cases and transitions visible</text><path d="M42 119L1238 119" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="62" y="178" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" fill="#d8edf6">Ways to climb n stairs with steps of 1 or 2</text><rect x="66" y="274" width="156" height="116" rx="11" fill="#1f4959" stroke="#6da8be" stroke-width="1.7"/><text x="144.0" y="310" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">dp[0] = 1</text><rect x="257" y="274" width="156" height="116" rx="11" fill="#1f4959" stroke="#6da8be" stroke-width="1.7"/><text x="335.0" y="310" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">dp[1] = 1</text><rect x="448" y="274" width="156" height="116" rx="11" fill="#1f4959" stroke="#6da8be" stroke-width="1.7"/><text x="526.0" y="310" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">dp[2] = 2</text><rect x="639" y="274" width="156" height="116" rx="11" fill="#1f4959" stroke="#6da8be" stroke-width="1.7"/><text x="717.0" y="310" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">dp[3] = 3</text><rect x="830" y="274" width="156" height="116" rx="11" fill="#1f4959" stroke="#6da8be" stroke-width="1.7"/><text x="908.0" y="310" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">dp[4] = 5</text><rect x="1021" y="274" width="156" height="116" rx="11" fill="#1f4959" stroke="#6da8be" stroke-width="1.7"/><text x="1099.0" y="310" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">dp[5] = 8</text><rect x="211" y="470" width="862" height="78" rx="11" fill="#1e584b" stroke="#7cd0ad" stroke-width="1.7"/><text x="642.0" y="506" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">dp[n] = dp[n-1] + dp[n-2]</text><path d="M42 599L1238 599" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="628" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#b2c8d5">This recurrence describes the simplified 1-or-2-step counting problem.</text></svg>