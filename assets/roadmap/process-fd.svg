<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="t d"><title id="t">fork() · FD object graph</title><desc id="d">Parent and child entries can refer to the same open-file description</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#76c9d3" stroke-width="1.8"/></marker></defs><rect width="1280" height="650" rx="18" fill="#0b1421"/><rect x="42" y="141" width="1196" height="432" rx="17" fill="#101f2e" stroke="#2c4356"/><text x="43" y="57" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="30" font-weight="700" fill="#f1f8fe">fork() · FD object graph</text><text x="43" y="97" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="500" fill="#acc6d7">Parent and child entries can refer to the same open-file description</text><path d="M42 119L1238 119" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="75" y="230" width="281" height="104" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="215.5" y="266" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Parent FD table</text><text x="215.5" y="291" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">fd 3</text><rect x="75" y="421" width="281" height="104" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="215.5" y="457" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Child FD table</text><text x="215.5" y="482" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">fd 3</text><rect x="513" y="314" width="295" height="141" rx="11" fill="#1f5b4d" stroke="#79d4af" stroke-width="1.7"/><text x="660.5" y="350" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">Shared struct file</text><text x="660.5" y="375" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">one offset + status flags</text><rect x="957" y="336" width="242" height="97" rx="11" fill="#1d3e50" stroke="#628ea7" stroke-width="1.7"/><text x="1078.0" y="372" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="650" fill="#e9f8fc">inode</text><text x="1078.0" y="397" text-anchor="middle" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="450" fill="#b3cddd">file identity</text><path d="M357 278H435V358H509" fill="none" stroke="#76cbce" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M357 468H435V408H509" fill="none" stroke="#76cbce" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M810 384L953 384" fill="none" stroke="#76c9d3" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="74" y="188" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="600" fill="#d7ebf5">fork() shares references to an open file description</text><path d="M42 599L1238 599" fill="none" stroke="#527083" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="628" text-anchor="start" font-family="Inter,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="500" fill="#b2c8d5">Two independent open() calls usually create separate descriptions for one inode.</text></svg>