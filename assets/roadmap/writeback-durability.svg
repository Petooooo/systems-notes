ans KR',Arial,sans-serif" font-size="17" font-weight="650" fill="#83dfee">3</text><path d="M461 431H685H900" stroke="#72d9e3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="772" y="418" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="500" fill="#c0e5ee">writeback / I/O</text><text x="53" y="499" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="650" fill="#84efc4">4</text><path d="M240 488H685H900" stroke="#81d9b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M900 527H240" stroke="#81d9b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="590" y="519" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="15" font-weight="550" fill="#a7ebd0">fsync() completion (on success)</text><rect x="999" y="256" width="189" height="206" rx="10" fill="#203b38" stroke="#4b997c" stroke-width="1.5"/><text x="1093" y="297" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="20" font-weight="650" fill="#caf3de">Persistence</text><text x="1093" y="333" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="400" fill="#afcec6">depends on</text><text x="1093" y="362" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="600" fill="#c4e6d4">FS + device</text><text x="1093" y="391" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="400" fill="#afcec6">contract</text><path d="M40 598 L1240 598" stroke="#395063" stroke-width="1" fill="none"/><text x="42" y="627" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="400" fill="#b0c3cf">The diagram illustrates ordering; fsync scope, errors and directory durability need separate checks.</text></svg>