<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580"><defs><linearGradient id="g"><stop stop-color="#111e30"/><stop offset="1" stop-color="#081320"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#75d9eb" fill="none" stroke-width="2"/></marker></defs><rect width="1280" height="580" rx="22" fill="url(#g)"/><text x="40" y="65" font-family="Arial" font-size="31" fill="#f3faff" font-weight="bold">Buffered Write to Storage</text><text x="40" y="102" font-family="Arial" font-size="18" fill="#a3bfd1">write() return and persistence are different milestones</text><path d="M40 125H1240" stroke="#425975"/><rect x="40" y="201" width="271" height="246" rx="13" fill="#1c3143" stroke="#527f9b" stroke-width="2"/><text x="58" y="248" font-family="Arial" font-size="20" fill="#80dff2">1</text><text x="58" y="314" font-family="Arial" font-weight="bold" font-size="21" fill="#f3f8fd">Application</text><text x="58" y="374" font-family="Arial" font-size="16" fill="#b9cede">write()</text><text x="58" y="401" font-family="Arial" font-size="16" fill="#b9cede">Accepted bytes</text><path d="M316 323H342" stroke="#8adeed" stroke-width="2.2" marker-end="url(#a)"/><rect x="349" y="201" width="271" height="246" rx="13" fill="#1c3143" stroke="#527f9b" stroke-width="2"/><text x="367" y="248" font-family="Arial" font-size="20" fill="#80dff2">2</text><text x="367" y="314" font-family="Arial" font-weight="bold" font-size="21" fill="#f3f8fd">Page cache</text><text x="367" y="374" font-family="Arial" font-size="16" fill="#b9cede">Dirty folios</text><text x="367" y="401" font-family="Arial" font-size="16" fill="#b9cede">Deferred writeback</text><path d="M625 323H651" stroke="#8adeed" stroke-width="2.2" marker-end="url(#a)"/><rect x="658" y="201" width="271" height="246" rx="13" fill="#1c3143" stroke="#527f9b" stroke-width="2"/><text x="676" y="248" font-family="Arial" font-size="20" fill="#80dff2">3</text><text x="676" y="314" font-family="Arial" font-weight="bold" font-size="21" fill="#f3f8fd">Filesystem</text><text x="676" y="374" font-family="Arial" font-size="16" fill="#b9cede">Journal + flush</text><text x="676" y="401" font-family="Arial" font-size="16" fill="#b9cede">Metadata ordering</text><path d="M934 323H960" stroke="#8adeed" stroke-width="2.2" marker-end="url(#a)"/><rect x="967" y="201" width="271" height="246" rx="13" fill="#1c3143" stroke="#68c9a2" stroke-width="2"/><text x="985" y="248" font-family="Arial" font-size="20" fill="#80dff2">4</text><text x="985" y="314" font-family="Arial" font-weight="bold" font-size="21" fill="#f3f8fd">Device</text><text x="985" y="374" font-family="Arial" font-size="16" fill="#b9cede">Volatile cache</text><text x="985" y="401" font-family="Arial" font-size="16" fill="#b9cede">Stable media</text><text x="40" y="539" font-family="Arial" font-size="16" fill="#b0c8d8">fsync() has scoped persistence semantics; it is not a database transaction.</text></svg>