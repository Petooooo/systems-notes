<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560"><rect width="1280" height="560" rx="20" fill="#0b1422"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#81ddec" stroke-width="2" fill="none"/></marker></defs><text x="42" y="56" font-family="Inter,Arial,sans-serif" font-size="30" fill="#f8faff" font-weight="700">Concurrency: Invariants and Ordering</text><text x="42" y="95" font-family="Inter,Arial,sans-serif" font-size="17" fill="#b4ccdf" >Synchronization is about correctness, progress and visibility</text><path d="M42 126H1238" stroke="#385269"/><rect x="43" y="185" width="274" height="260" rx="14" fill="#1c3043" stroke="#5885a3" stroke-width="2"/><text x="61" y="232" font-family="Inter,Arial,sans-serif" font-size="21" fill="#8de6f3" font-weight="700">01</text><text x="61" y="294" font-family="Inter,Arial,sans-serif" font-size="22" fill="#f1f9ff" font-weight="650">Threads</text><text x="61" y="352" font-family="Inter,Arial,sans-serif" font-size="17" fill="#c2d4e2" >Shared heap</text><text x="61" y="384" font-family="Inter,Arial,sans-serif" font-size="16" fill="#aabfd1" >Independent stacks</text><path d="M322 313H341" stroke="#81ddec" stroke-width="2.5" marker-end="url(#a)"/><rect x="350" y="185" width="274" height="260" rx="14" fill="#1c3043" stroke="#5885a3" stroke-width="2"/><text x="368" y="232" font-family="Inter,Arial,sans-serif" font-size="21" fill="#8de6f3" font-weight="700">02</text><text x="368" y="294" font-family="Inter,Arial,sans-serif" font-size="22" fill="#f1f9ff" font-weight="650">Mutex</text><text x="368" y="352" font-family="Inter,Arial,sans-serif" font-size="17" fill="#c2d4e2" >Critical section</text><text x="368" y="384" font-family="Inter,Arial,sans-serif" font-size="16" fill="#aabfd1" >Protect invariant</text><path d="M629 313H648" stroke="#81ddec" stroke-width="2.5" marker-end="url(#a)"/><rect x="657" y="185" width="274" height="260" rx="14" fill="#1c3043" strok