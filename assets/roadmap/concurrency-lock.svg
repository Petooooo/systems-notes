<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="s-title s-desc"><title id="s-title">Mutex contention · two thread timelines</title><desc id="s-desc">A contended mutex serializes the critical section, not the rest of the program</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#67cbdc" stroke-width="1.7"/></marker><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#294353"/></pattern></defs><rect width="1280" height="650" fill="#0b1421" rx="18"/><rect x="24" y="130" width="1232" height="445" rx="18" fill="#0e1c2b" stroke="#23384c"/><rect x="24" y="130" width="1232" height="445" rx="18" fill="url(#dots)" opacity=".32"/><text x="40" y="58" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2f8fe">Mutex contention · two thread timelines</text><text x="40" y="93" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="400" fill="#aac0d0">A contended mutex serializes the critical section, not the rest of the program</text><path d="M40 112 L1240 112" stroke="#395063" stroke-width="1" fill="none"/><text x="70" y="195" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="650" fill="#edf6fb">Thread A</text><text x="70" y="352" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="650" fill="#edf6fb">Thread B</text><path d="M293 210 L293 495" stroke="#2a4152" stroke-width="1" fill="none" stroke-dasharray="4 6"/><path d="M448 210 L448 495" stroke="#2a4152" stroke-width="1" fill="none" stroke-dasharray="4 6"/><path d="M603 210 L603 495" stroke="#2a4152" stroke-width="1" fill="none" stroke-dasharray="4 6"/><path d="M758 210 L758 495" stroke="#2a4152" stroke-width="1" fill="none" stroke-dasharray="4 6"/><path d="M913 210 L913 495" stroke="#2a4152" stroke-width="1" fill="none" stroke-dasharray="4 6"/><path d="M1068 210 L1068 495" stroke="#2a4152" stroke-width="1" fill="none" stroke-dasharray="4 6"/><rect x="294" y="224" width="150" height="59" rx="6" fill="#2d465a" stroke="#4f778c" stroke-width="1.5"/><text x="369" y="261" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="600" fill="#dbeef8">lock()</text><rect x="444" y="224" width="390" height="59" rx="6" fill="#1a6250" stroke="#76cfae" stroke-width="1.5"/><text x="638" y="261" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="20" font-weight="650" fill="#e1fced">critical section</text><rect x="834" y="224" width="150" height="59" rx="6" fill="#2d465a" stroke="#4f778c" stroke-width="1.5"/><text x="909" y="261" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="600" fill="#dbeef8">unlock()</text><rect x="294" y="380" width="540" height="59" rx="6" fill="#4a3c42" stroke="#b68a86" stroke-width="1.5"/><text x="564" y="417" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="20" font-weight="600" fill="#fae0d0">blocked: mutex held by A</text><rect x="834" y="380" width="150" height="59" rx="6" fill="#1a6250" stroke="#76cfae" stroke-width="1.5"/><text x="909" y="417" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="18" font-weight="600" fill="#e1fced">lock</text><path d="M834 217 L834 457" stroke="#dfc580" stroke-width="2" fill="none" stroke-dasharray="5 5"/><text x="834" y="481" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="600" fill="#dfc580">unlock / wakeup</text><text x="71" y="517" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="19" font-weight="600" fill="#b9dbe5">Shared invariant</text><text x="268" y="517" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="400" fill="#d2e3ef">Only the holder enters the protected section; scheduling is independent.</text><path d="M40 598 L1240 598" stroke="#395063" stroke-width="1" fill="none"/><text x="42" y="627" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="400" fill="#b0c3cf">Schematic order only; actual wakeup and scheduling may occur later.</text></svg>