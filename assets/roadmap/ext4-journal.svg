<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="s-title s-desc"><title id="s-title">ext4 / JBD2 · commit is not a user transaction</title><desc id="s-desc">Visual separation of ordered data writes, journal commit, and later checkpointing</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#67cbdc" stroke-width="1.7"/></marker><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#294353"/></pattern></defs><rect width="1280" height="650" fill="#0b1421" rx="18"/><rect x="24" y="130" width="1232" height="445" rx="18" fill="#0e1c2b" stroke="#23384c"/><rect x="24" y="130" width="1232" height="445" rx="18" fill="url(#dots)" opacity=".32"/><text x="40" y="58" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2f8fe">ext4 / JBD2 · commit is not a user transaction</text><text x="40" y="93" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="400" fill="#aac0d0">Visual separation of ordered data writes, journal commit, and later checkpointing</text><path d="M40 112 L1240 112" stroke="#395063" stroke-width="1" fill="none"/><text x="55" y="175" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="18" font-weight="600" fill="#cfdfed">Ordered-mode sketch (conceptual)</text><path d="M100 495 L1130 495" stroke="#648295" stroke-width="2" fill="none"/><path d="M1130 495 L1185 495" stroke="#67cbdc" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M210 195 L210 496" stroke="#304b5e" stroke-width="1.5" fill="none" stroke-dasharray="4 5"/><text x="210" y="534" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="550" fill="#dcecf3">Data blocks</text><path d="M440 195 L440 496" stroke="#304b5e" stroke-width="1.5" fill="none" stroke-dasharray="4 5"/><text x="440" y="534" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="550" fill="#dcecf3">Journal metadata</text><path d="M685 195 L685 496" stroke="#304b5e" stroke-width="1.5" fill="none" stroke-dasharray="4 5"/><text x="685" y="534" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="550" fill="#dcecf3">Commit record</text><path d="M930 195 L930 496" stroke="#304b5e" stroke-width="1.5" fill="none" stroke-dasharray="4 5"/><text x="930" y="534" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="550" fill="#dcecf3">Checkpoint</text><rect x="125" y="250" width="230" height="62" rx="8" fill="#194a43" stroke="#64c2a1" stroke-width="1.5"/><text x="240" y="290" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="18" font-weight="600" fill="#d0f8e7">data writeback</text><rect x="362" y="350" width="274" height="62" rx="8" fill="#174359" stroke="#679fc0" stroke-width="1.5"/><text x="499" y="389" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="600" fill="#def0f8">transaction metadata</text><rect x="684" y="350" width="127" height="62" rx="8" fill="#235d4d" stroke="#71d9af" stroke-width="1.5"/><text x="748" y="389" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="700" fill="#e3fff0">commit</text><rect x="872" y="350" width="271" height="62" rx="8" fill="#263b50" stroke="#667c93" stroke-width="1.5"/><text x="1008" y="389" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="600" fill="#d6e8f5">checkpoint later</text><path d="M650 206V474" stroke="#f2bb77" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><text x="650" y="236" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="600" fill="#f8cc8b">crash?</text><text x="55" y="454" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="18" font-weight="500" fill="#d0e3ec">The journal helps recover consistent metadata state.</text><path d="M40 598 L1240 598" stroke="#395063" stroke-width="1" fill="none"/><text x="42" y="627" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="400" fill="#b0c3cf">Illustrative ordered-mode sequence; data durability still depends on sync, errors and device guarantees.</text></svg>