<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="s-title s-desc"><title id="s-title">F2FS · segment cleaning</title><desc id="s-desc">Live-block relocation and victim-space reclamation, not a generic four-step pipeline</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#67cbdc" stroke-width="1.7"/></marker><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#294353"/></pattern></defs><rect width="1280" height="650" fill="#0b1421" rx="18"/><rect x="24" y="130" width="1232" height="445" rx="18" fill="#0e1c2b" stroke="#23384c"/><rect x="24" y="130" width="1232" height="445" rx="18" fill="url(#dots)" opacity=".32"/><text x="40" y="58" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2f8fe">F2FS · segment cleaning</text><text x="40" y="93" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="400" fill="#aac0d0">Live-block relocation and victim-space reclamation, not a generic four-step pipeline</text><path d="M40 112 L1240 112" stroke="#395063" stroke-width="1" fill="none"/><text x="55" y="192" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="20" font-weight="650" fill="#eaf5fc">Victim segment</text><text x="55" y="220" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="15" font-weight="400" fill="#9db9c9">valid blocks are copied before space is reclaimed</text><rect x="55" y="246" width="60" height="64" rx="5" fill="#1a6153" stroke="#80ddbf" stroke-width="1.5"/><text x="85" y="285" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#abfce0">V</text><rect x="125" y="246" width="60" height="64" rx="5" fill="#3a3447" stroke="#745f70" stroke-width="1.5"/><text x="155" y="285" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#cbb6bf">×</text><rect x="195" y="246" width="60" height="64" rx="5" fill="#1a6153" stroke="#80ddbf" stroke-width="1.5"/><text x="225" y="285" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#abfce0">V</text><rect x="265" y="246" width="60" height="64" rx="5" fill="#3a3447" stroke="#745f70" stroke-width="1.5"/><text x="295" y="285" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#cbb6bf">×</text><rect x="335" y="246" width="60" height="64" rx="5" fill="#3a3447" stroke="#745f70" stroke-width="1.5"/><text x="365" y="285" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#cbb6bf">×</text><rect x="405" y="246" width="60" height="64" rx="5" fill="#1a6153" stroke="#80ddbf" stroke-width="1.5"/><text x="435" y="285" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#abfce0">V</text><rect x="55" y="322" width="60" height="64" rx="5" fill="#3a3447" stroke="#745f70" stroke-width="1.5"/><text x="85" y="361" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#cbb6bf">×</text><rect x="125" y="322" width="60" height="64" rx="5" fill="#3a3447" stroke="#745f70" stroke-width="1.5"/><text x="155" y="361" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#cbb6bf">×</text><rect x="195" y="322" width="60" height="64" rx="5" fill="#1a6153" stroke="#80ddbf" stroke-width="1.5"/><text x="225" y="361" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#abfce0">V</text><rect x="265" y="322" width="60" height="64" rx="5" fill="#3a3447" stroke="#745f70" stroke-width="1.5"/><text x="295" y="361" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#cbb6bf">×</text><rect x="335" y="322" width="60" height="64" rx="5" fill="#3a3447" stroke="#745f70" stroke-width="1.5"/><text x="365" y="361" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#cbb6bf">×</text><rect x="405" y="322" width="60" height="64" rx="5" fill="#3a3447" stroke="#745f70" stroke-width="1.5"/><text x="435" y="361" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#cbb6bf">×</text><text x="55" y="420" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="400" fill="#a9dfce">V = live data</text><text x="220" y="420" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="400" fill="#cfb3bc">× = invalid</text><path d="M503 308 L681 308" stroke="#67cbdc" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="591" y="273" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="600" fill="#80e1e5">copy valid</text><text x="720" y="192" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="20" font-weight="650" fill="#eaf5fc">Destination segment</text><text x="720" y="220" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="15" font-weight="400" fill="#9db9c9">only live blocks are relocated</text><rect x="720" y="248" width="63" height="68" rx="5" fill="#1a6153" stroke="#80ddbf" stroke-width="1.5"/><text x="752" y="289" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="22" font-weight="700" fill="#abfce0">V</text><rect x="795" y="248" width="63" height="68" rx="5" fill="#1a6153" stroke="#80ddbf" stroke-width="1.5"/><text x="827" y="289" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="22" font-weight="700" fill="#abfce0">V</text><rect x="870" y="248" width="63" height="68" rx="5" fill="#1a6153" stroke="#80ddbf" stroke-width="1.5"/><text x="902" y="289" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="22" font-weight="700" fill="#abfce0">V</text><rect x="945" y="248" width="63" height="68" rx="5" fill="#1a6153" stroke="#80ddbf" stroke-width="1.5"/><text x="977" y="289" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="22" font-weight="700" fill="#abfce0">V</text><rect x="1020" y="248" width="63" height="68" rx="5" fill="#192c3a" stroke="#40546b" stroke-width="1.5"/><text x="1052" y="289" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="22" font-weight="700" fill="#abfce0"></text><rect x="1095" y="248" width="63" height="68" rx="5" fill="#192c3a" stroke="#40546b" stroke-width="1.5"/><text x="1127" y="289" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="22" font-weight="700" fill="#abfce0"></text><text x="75" y="468" font-family="Inter,&#39;Noto Sans KR&#39;,Arial,sans-serif" font-size="17" font-weight="500" fill="#bedee5">After relocation, the victim segment can be reclaimed.</text><rect x="718" y="490" width="456" height="55" rx="10" fill="#142e3c" stroke="#406775" stroke-width="1.5"/><text x="946" y="524" text-anchor="middle" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="18" font-weight="600" fill="#d5edf5">Filesystem GC ≠ SSD internal GC</text><path d="M40 598 L1240 598" stroke="#395063" stroke-width="1" fill="none"/><text x="42" y="627" text-anchor="start" font-family="Inter,'Noto Sans KR',Arial,sans-serif" font-size="16" font-weight="400" fill="#b0c3cf">Conceptual block map; actual granularity and policy depend on filesystem configuration.</text></svg>